<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление продажами</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">📚 BookStore Manager</a>
    </div>
</nav>
<div class="container mt-4">

    <h1>Управление продажами</h1>

    <!-- Форма создания новой продажи -->
    <div class="card mb-4">
        <div class="card-header">Оформить новую продажу</div>
        <div class="card-body">
            <form th:action="@{/sales}" method="post">
                <div class="row">
                    <div class="col-md-6">
                        <label for="clients" class="form-label">Выберите клиента</label>
                        <select class="form-select" id="clients" name="clients" required>
                            <option value="">-- Выберите клиента --</option>
                            <option th:each="client : ${clients}"
                                    th:value="${client.id}"
                                    th:text="${client.firstName + ' ' + client.lastName}">
                            </option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="book" class="form-label">Выберите книгу</label>
                        <select class="form-select" id="book" name="book" required>
                            <option value="">-- Выберите книгу --</option>
                            <option th:each="book : ${books}"
                                    th:if="${book.count > 0}"
                                    th:value="${book.id}"
                                    th:text="${book.name + ' (' + book.author + ') - ' + book.price + '₽'}">
                            </option>
                        </select>
                        <div class="form-text">Отображаются только книги с количеством > 0</div>
                    </div>
                    <div class="col-md-6">
                        <label for="quantity" class="form-label">Количество</label>
                        <input type="number" class="form-control" id="quantity" name="quantity" min="1" th:value="1" required>
                    </div>
                </div>
                <div class="mt-3">
                    <button type="submit" class="btn btn-success">Оформить продажу</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Таблица всех продаж -->
    <div class="card">
        <div class="card-header">Продажи</div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead>
                    <tr>
                        <th>ID продажи</th>
                        <th>Клиент</th>
                        <th>Книга</th>
                        <th>Цена за штуку</th>
                        <th>Количество</th>
                        <th>Сумма</th>
                        <th>Дата и время</th>
                        <th>Действия</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="sale : ${sales}">
                        <td th:text="${sale.id}"></td>
                        <td th:text="${sale.client.firstName + ' ' + sale.client.lastName}"></td>
                        <td th:text="${sale.book.name + ' (' + sale.book.author + ')'}"></td>
                        <td th:text="${sale.salePrice + '₽'}"></td>
                        <td th:text="${sale.quantity}"></td>
                        <td th:text="${sale.totalPrice + '₽'}"></td>
                        <td th:text="${#temporals.format(sale.saleTime, 'dd.MM.yyyy HH:mm')}"></td>
                        <td>
                            <a th:href="@{/sales/delete/{id}(id=${sale.id})}"
                               class="btn btn-sm btn-danger"
                               onclick="return confirm('Отменить эту продажу?')">
                                Отменить
                            </a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
